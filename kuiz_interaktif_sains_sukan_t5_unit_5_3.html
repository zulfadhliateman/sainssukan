<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuiz Interaktif Sains Sukan T5 - Unit 5.3</title>
<style>
:root{--navy:#102b55;--blue:#1769aa;--red:#c62828;--pale:#eef5ff;--ink:#17243a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eaf2ff,#fff1f1);font-family:Arial,sans-serif;color:var(--ink);padding:20px}.wrap{max-width:850px;margin:auto}.head{background:linear-gradient(110deg,var(--navy),var(--blue));color:white;padding:25px;border-radius:18px;border-bottom:6px solid var(--red);box-shadow:0 8px 24px #18345a30}.head h1{margin:0 0 8px;font-size:clamp(23px,4vw,32px)}.head p{margin:5px 0}.credit{font-size:13px;opacity:.9;margin-top:16px!important}.progress{height:9px;background:#dbe6f5;border-radius:20px;margin:18px 0;overflow:hidden}.bar{height:100%;background:var(--red);width:0;transition:.25s}.card{background:white;border-radius:16px;padding:23px;margin:16px 0;box-shadow:0 5px 20px #18345a12}.meta{color:var(--blue);font-weight:bold;font-size:14px}.question{font-size:19px;line-height:1.5;font-weight:700;margin:14px 0}.option{display:block;width:100%;text-align:left;border:2px solid #dce5f1;background:#fff;padding:13px 15px;border-radius:11px;margin:9px 0;font-size:16px;cursor:pointer;color:var(--ink)}.option:hover:not(:disabled){border-color:var(--blue);background:var(--pale)}.option:disabled{cursor:default;opacity:1}.option.correct{border-color:#23834c;background:#eaf8ef}.option.wrong{border-color:var(--red);background:#fff0f0}.feedback{display:none;margin-top:15px;padding:14px;border-radius:10px;line-height:1.5}.feedback.show{display:block}.good{background:#eaf8ef;border-left:5px solid #23834c}.bad{background:#fff0f0;border-left:5px solid var(--red)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button.primary,button.secondary{border:0;padding:12px 19px;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer}.primary{background:var(--red);color:white}.secondary{background:var(--navy);color:white}.primary:disabled{opacity:.4;cursor:not-allowed}.result{text-align:center}.score{font-size:48px;color:var(--blue);font-weight:bold}.grade{font-size:21px;font-weight:bold;margin:8px}.review{text-align:left;border-top:1px solid #e2e8f0;padding:12px 0;line-height:1.5}.small{font-size:13px;color:#5b6980}.hide{display:none}
</style></head><body><div class="wrap">
<header class="head"><h1>Kuiz Interaktif Sains Sukan Tingkatan 5</h1><p><b>Bidang 5: Pemakanan Sukan</b></p><p>Unit 5.3 – Bantuan Ergogenik</p><p class="credit">Disediakan oleh : Cikgu Zulfadhli bin Ateman</p></header>
<div class="progress"><div class="bar" id="bar"></div></div><main id="quiz" class="card"><div class="meta" id="count"></div><div class="question" id="question"></div><div id="options"></div><div id="feedback" class="feedback"></div><div class="actions"><button id="next" class="primary" disabled>Soalan seterusnya</button></div></main>
<section id="result" class="card result hide"></section><p class="small">Latihan ulang kaji objektif • Pilih satu jawapan yang paling tepat bagi setiap soalan.</p></div>
<script>
const qs=[
{q:'Apakah maksud bantuan ergogenik dalam konteks sukan?',o:['Bahan atau kaedah yang boleh membantu meningkatkan prestasi atlet','Makanan yang diambil untuk mengurangkan berat badan sahaja','Aktiviti memanaskan badan sebelum pertandingan','Peralatan yang digunakan untuk mengukur kecergasan'],a:0,e:'Bantuan ergogenik merujuk kepada bahan atau fenomena tertentu yang boleh meningkatkan prestasi atlet dalam sesuatu sukan.'},
{q:'Antara berikut, yang manakah merupakan contoh bantuan ergogenik pemakanan?',o:['Imageri','Tokokan karbohidrat','Latihan pliometrik','Peralatan kasut berpaku'],a:1,e:'Tokokan karbohidrat ialah strategi pemakanan yang digunakan untuk meningkatkan simpanan karbohidrat sebelum acara daya tahan.'},
{q:'Apakah fungsi utama kafein kepada atlet?',o:['Menambahkan jisim otot secara langsung','Meningkatkan tumpuan dan stamina','Meningkatkan sintesis asid amino','Menggantikan elektrolit yang hilang'],a:1,e:'Bahan rujukan menyatakan kafein boleh meningkatkan tumpuan atlet dan stamina dalam aktiviti daya tahan kardiovaskular.'},
{q:'Atlet manakah paling sesuai menggunakan strategi tokokan karbohidrat?',o:['Pelari pecut 100 meter','Atlet angkat berat','Pelari maraton','Pemain acara lontar peluru'],a:2,e:'Tokokan karbohidrat sesuai untuk acara daya tahan berjangka masa panjang seperti maraton.'},
{q:'Apakah fungsi kreatina yang dinyatakan dalam bahan rujukan?',o:['Membantu simpanan tenaga fosfokreatin untuk aktiviti intensiti tinggi','Mengawal suhu badan ketika bersukan','Meningkatkan penyerapan air dalam usus','Menggantikan protein dalam pembaikan tisu'],a:0,e:'Kreatina dikaitkan dengan simpanan fosfokreatin dalam otot yang membantu aktiviti berintensiti tinggi.'},
{q:'Bahan ergogenik manakah yang sering dikaitkan dengan penambahan jisim dan kekuatan otot?',o:['Kafein','Whey protein','Minuman isotonik','Bikarbonat'],a:1,e:'Whey protein membekalkan protein yang membantu sintesis protein serta pembinaan dan pemulihan otot.'},
{q:'Pilih pernyataan yang BENAR tentang whey protein.',o:['Membantu menambahkan jisim dan kekuatan otot','Menggantikan semua keperluan air atlet','Berfungsi menurunkan suhu badan','Meneutralkan semua asid dalam darah'],a:0,e:'Dalam bahan rujukan, whey protein dikaitkan dengan peningkatan jisim otot, kekuatan otot dan daya tahan otot.'},
{q:'Bikarbonat sering digunakan sebagai bantuan ergogenik kerana peranannya berkaitan dengan…',o:['Peningkatan jisim otot secara langsung','Penimbal asid semasa aktiviti intensiti tinggi','Penambahan simpanan lemak','Penghasilan vitamin dalam tubuh'],a:1,e:'Bikarbonat berfungsi sebagai penimbal yang membantu mengurangkan kesan peningkatan keasidan semasa aktiviti intensiti tinggi.'},
{q:'Antara berikut, yang manakah padanan bantuan ergogenik dengan contoh yang TEPAT?',o:['Psikologikal – tokokan karbohidrat','Mekanikal – imageri','Farmakologikal – vitamin B kompleks','Fisiologikal – latihan pliometrik'],a:2,e:'Bahan rujukan Bidang 5 memadankan vitamin B kompleks dengan klasifikasi farmakologikal. Pilihan lain tidak sepadan dengan contoh yang dinyatakan.'},
{q:'Apakah tujuan utama tokokan karbohidrat sebelum acara daya tahan?',o:['Mengurangkan kandungan air dalam badan','Meningkatkan simpanan glikogen','Mengurangkan keperluan oksigen kepada sifar','Meningkatkan jisim tulang'],a:1,e:'Tokokan karbohidrat bertujuan meningkatkan simpanan glikogen sebagai sumber tenaga bagi acara daya tahan.'},
{q:'Seorang atlet lumba basikal jarak jauh mengambil gel karbohidrat semasa pertandingan. Apakah tujuan tindakan tersebut?',o:['Membekalkan karbohidrat semasa aktiviti berpanjangan','Meningkatkan fleksibiliti sendi','Mengurangkan kadar pernafasan','Menggantikan fungsi protein'],a:0,e:'Gel karbohidrat ialah pilihan sumber karbohidrat yang mudah diambil semasa acara berjangka masa panjang.'},
{q:'Pilih kombinasi yang menunjukkan bahan bantuan ergogenik yang boleh membantu prestasi atlet.',o:['Kreatina, kafein dan whey protein','Air kosong, vitamin dan serat sahaja','Garam, minyak masak dan gula-gula sahaja','Kalsium, air dan serat sahaja'],a:0,e:'Kreatina, kafein dan whey protein merupakan contoh bantuan ergogenik pemakanan yang dibincangkan dalam bahan Bidang 5.'},
{q:'Apakah kesan penyalahgunaan steroid anabolik yang perlu diberi perhatian?',o:['Meningkatkan kesihatan semua organ','Boleh menjejaskan fungsi hati dan buah pinggang','Menghapuskan risiko kecederaan','Menggantikan keperluan latihan'],a:1,e:'Bahan peperiksaan yang dimuat naik mengaitkan penyalahgunaan bahan ergogenik tertentu seperti steroid dengan masalah pada organ hati dan buah pinggang.'},
{q:'Mengapakah atlet perlu mendapatkan nasihat profesional sebelum mengambil suplemen ergogenik?',o:['Supaya pengambilan sesuai dengan keperluan dan mengurangkan risiko kesan sampingan','Supaya atlet boleh mengambil dos sebanyak mungkin','Supaya semua suplemen boleh menggantikan makanan','Supaya atlet tidak perlu menjalani latihan'],a:0,e:'Penggunaan bahan ergogenik perlu mengambil kira kesesuaian, keselamatan dan kemungkinan kesan sampingan.'},
{q:'Antara berikut, yang manakah pernyataan PALING tepat tentang bantuan ergogenik?',o:['Semua bantuan ergogenik dibenarkan tanpa had','Bantuan ergogenik menjamin kemenangan atlet','Penggunaan perlu mengambil kira keberkesanan, keselamatan dan peraturan sukan','Bantuan ergogenik boleh menggantikan latihan dan pemakanan seimbang'],a:2,e:'Bantuan ergogenik bukan jaminan kemenangan. Penggunaannya perlu dinilai dari segi keselamatan, kesesuaian dan peraturan sukan.'}
];
let i=0,score=0,answers=[];const $=id=>document.getElementById(id);function render(){let q=qs[i];$('count').textContent=`SOALAN ${i+1} DARIPADA ${qs.length}`;$('question').textContent=q.q;$('options').innerHTML='';$('feedback').className='feedback';$('feedback').textContent='';$('next').disabled=true;$('next').textContent=i===qs.length-1?'Lihat keputusan':'Soalan seterusnya';q.o.forEach((v,j)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+j)+'. '+v;b.onclick=()=>choose(j);$('options').appendChild(b)});$('bar').style.width=(i/qs.length*100)+'%'}function choose(j){let q=qs[i],bs=[...document.querySelectorAll('.option')];bs.forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add('correct');if(k===j&&j!==q.a)b.classList.add('wrong')});let ok=j===q.a;if(ok)score++;answers.push({j,ok});$('feedback').className='feedback show '+(ok?'good':'bad');$('feedback').innerHTML=`<b>${ok?'Betul!':'Belum tepat.'}</b> Jawapan: <b>${String.fromCharCode(65+q.a)}</b><br>${q.e}`;$('next').disabled=false;$('bar').style.width=((i+1)/qs.length*100)+'%'}$('next').onclick=()=>{if(i<qs.length-1){i++;render()}else finish()};function finish(){ $('quiz').classList.add('hide');let pct=Math.round(score/qs.length*100),grade=pct>=80?'Cemerlang':pct>=50?'Sederhana':'Perlu usaha lagi';$('result').classList.remove('hide');$('result').innerHTML=`<h2>Keputusan Kuiz Unit 5.3</h2><div class="score">${score}/${qs.length}</div><div>${pct}%</div><div class="grade">${grade}</div><p>${pct>=80?'Tahniah! Penguasaan anda sangat baik.':pct>=50?'Baik. Teruskan ulang kaji untuk meningkatkan penguasaan.':'Jangan berputus asa. Baca semula penerangan dan cuba lagi.'}</p><h3>Semakan jawapan</h3>${qs.map((q,k)=>`<div class="review"><b>${k+1}. ${q.q}</b><br>Jawapan anda: ${String.fromCharCode(65+answers[k].j)} ${answers[k].ok?'✓':'✗'}<br>Jawapan betul: <b>${String.fromCharCode(65+q.a)}. ${q.o[q.a]}</b><br><span class="small">${q.e}</span></div>`).join('')}<button class="primary" onclick="location.reload()">Cuba semula</button>`}render();
</script></body></html>
